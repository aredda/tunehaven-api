services:
  database:
    container_name: tunehaven_db
    image: 'postgres:latest'
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - ./test-db-data/:/var/lib/postgresql/data/

  api:
    container_name: tunehaven_api
    build:
      context: .
      dockerfile: dev.Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - database
    env_file:
      - .env.dev

  storage_subscriber:
    container_name: tunehaven_storage_sub
    build:
      context: .
      dockerfile: dev.Dockerfile
    env_file:
      - .env.dev
    depends_on:
      - database
    command: ["ruby", "bin/storage_subscriber"]
