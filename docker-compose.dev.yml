services:
  database:
    container_name: tunehaven_db
    image: 'postgres:17'
    ports:
      - "127.0.0.1:5432:5432"
    env_file:
      - .env
    volumes:
      - ./test-db-data/:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    container_name: tunehaven_api
    volumes:
      - .:/app
    build:
      context: .
      dockerfile: dev.Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      database:
        condition: service_healthy
    env_file:
      - .env.dev

  storage_subscriber:
    container_name: tunehaven_storage_sub
    build:
      context: .
      dockerfile: dev.Dockerfile
    volumes:
      - .:/app
    env_file:
      - .env.dev
    depends_on:
      database:
        condition: service_healthy
    command: [ "bundle", "exec", "rails", "runner", "bin/storage_subscriber" ]
