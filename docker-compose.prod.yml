services:

  database:
    container_name: database
    image: 'postgres:17'
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    env_file:
      - .env
    volumes:
      - ./db-data/:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    container_name: api
    build:
      context: .
      dockerfile: prod.Dockerfile
    image: tunehaven:latest
    restart: unless-stopped
    entrypoint: ./entrypoint.sh
    ports:
      - "3000:3000"
    depends_on:
      database:
        condition: service_healthy
    env_file:
      - .env

  jobber:
    container_name: jobber
    image: tunehaven:latest
    restart: unless-stopped
    env_file:
      - .env
    command: bundle exec good_job start
    depends_on:
      database:
        condition: service_healthy

  storage_subscriber:
    container_name: storage_sub
    image: tunehaven:latest
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
    entrypoint: ./storage_subscriber_entrypoint.sh

  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
