services:

  database:
    container_name: database
    image: 'postgres:17'
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - ./db-data/:/var/lib/postgresql/data/

  api:
    container_name: api
    build:
      context: .
      dockerfile: prod.Dockerfile
    image: tunehaven:latest
    entrypoint: ./entrypoint.sh
    ports:
      - "3000:3000"
    depends_on:
      - database
    env_file:
      - .env

  jobber:
    container_name: jobber
    image: tunehaven:latest
    env_file:
      - .env
    command: bundle exec good_job start
    depends_on:
      - database
      - api

  nginx:
    container_name: nginx
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  storage_subscriber:
    container_name: storage_sub
    image: tunehaven:latest
    env_file:
      - .env
    depends_on:
      - database
    entrypoint: ./storage_subscriber_entrypoint.sh
