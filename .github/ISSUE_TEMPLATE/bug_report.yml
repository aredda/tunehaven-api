name: Bug report
description: Report a defect in Tunehaven API
title: "fix: <short description>"
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please search existing issues first,
        and **never paste secrets** (tokens, passwords, service-account JSON).
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Call `POST /api/...` with ...
        2. ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: The commit SHA or branch you are running.
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        - Ruby version:
        - Rails version:
        - PostgreSQL version:
        - Deployment: native / Docker
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or responses
      description: Paste request/response bodies or logs (redact anything sensitive).
      render: shell
    validations:
      required: false
